<title>No internet · Repairs helper</title>
<!--
  Bundled inside the iOS / Android app. The app loads https://repairshelper.com;
  this page is only shown (capacitor.config.json → server.errorPath) when that
  load fails — no network, or the site unreachable. It mirrors the website's own
  /offline page and must work with nothing: no network, no plugins (Android
  does not give an error page access to them), no external files. That is why
  the logo is inline: Android serves this page on its own, and a file next to
  it would be fetched from the network that just failed.
-->
<style>
  :root { --bg: #ffffff; --fg: #111318; --muted: #5b616e; --card: #f5f6f8; --btn: #111318; --btn-fg: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b0c0e; --fg: #eceef2; --muted: #a2a8b4; --card: #16181c; --btn: #eceef2; --btn-fg: #0b0c0e; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; font-size: 20px; letter-spacing: -0.01em; }
  header img { width: 40px; height: 40px; border-radius: 12px; }
  main { width: 100%; max-width: 420px; background: var(--card); border-radius: 20px; padding: 28px 24px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 12px; }
  p { margin: 0 0 8px; color: var(--muted); }
  button { margin-top: 20px; width: 100%; min-height: 56px; border: 0; border-radius: 14px;
    background: var(--btn); color: var(--btn-fg); font: inherit; font-weight: 600; font-size: 17px; }
  button:active { opacity: 0.8; }
</style>
