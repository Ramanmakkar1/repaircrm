# RepairFlow — full stack for a single-box deploy.
#
#   cp .env.example .env   (fill in AUTH_SECRET at minimum)
#   docker compose up -d
#
# App: http://localhost:3020 — create your shop at /signup.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: repairflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-repairflow}
      POSTGRES_DB: repairflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repairflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    restart: "no"
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://repairflow:${POSTGRES_PASSWORD:-repairflow}@db:5432/repairflow
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3020:3020"
    env_file: .env
    environment:
      # Overrides the .env value so the container talks to the db service.
      DATABASE_URL: postgresql://repairflow:${POSTGRES_PASSWORD:-repairflow}@db:5432/repairflow
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  uploads:
