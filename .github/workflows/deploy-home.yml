name: Deploy to home server

# Every push to main ships repairshelper.com. The self-hosted runner on Raman's
# home server checks the commit out; the root-owned deploy-repairhelper script
# then builds the image, applies Prisma migrations, swaps the container and
# health-checks it, putting the previous release back if the new one fails.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-repairhelper
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, local-repairhelper]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build, migrate, deploy and verify on the home server
        run: sudo -n /usr/local/sbin/deploy-repairhelper
